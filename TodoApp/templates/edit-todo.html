{% extends 'layout.html' %}
{% block content %}
<div class="container" style="margin-top: 80px;">
    <div class="card">
        <div class="card-header">
            Let's edit the todo!
        </div>
        <div class="card-body">
            <form id="editTodoForm">
                <input type="hidden" name="id" value="{{ todo.id }}">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" class="form-control" name="title" id="title" value="{{ todo.title }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea class="form-control" name="description" id="description" rows="3" required>{{ todo.description }}</textarea>
                </div>
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select name="priority" id="priority" class="form-control" required>
                        <option value="1" {% if todo.priority==1 %}selected{% endif %}>1</option>
                        <option value="2" {% if todo.priority==2 %}selected{% endif %}>2</option>
                        <option value="3" {% if todo.priority==3 %}selected{% endif %}>3</option>
                        <option value="4" {% if todo.priority==4 %}selected{% endif %}>4</option>
                        <option value="5" {% if todo.priority==5 %}selected{% endif %}>5</option>
                    </select>
                </div>
                <div class="form-group form-check">
                    <input type="checkbox" class="form-check-input" id="complete" name="complete" {% if todo.complete %}checked{% endif %}>
                    <label class="form-check-label" for="complete">Complete</label>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Edit your todo</button>
                    <button type="button" id="deleteButton" class="btn btn-danger ml-2">Delete</button>
                    <a href="/todos/todo-page" class="btn btn-success ml-2">Back</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
